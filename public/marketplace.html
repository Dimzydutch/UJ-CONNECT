<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace — UJ Connect</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="layout-root"></div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
  let allCategories = [];
  const params = new URLSearchParams(window.location.search);

  document.addEventListener('DOMContentLoaded', async () => {
    renderLayout('marketplace');
    document.getElementById('page-content').innerHTML = `
      <div class="section-title-row">
        <h2>Marketplace</h2>
      </div>

      <div class="tabs" id="type-tabs">
        <button class="tab-btn" data-type="">All</button>
        <button class="tab-btn" data-type="good">Goods</button>
        <button class="tab-btn" data-type="service">Services</button>
      </div>

      <div class="filter-row">
        <select id="category-filter" class="select-input">
          <option value="">All Categories</option>
        </select>
        <select id="subcategory-filter" class="select-input" disabled>
          <option value="">All Subcategories</option>
        </select>
        <select id="sort-filter" class="select-input">
          <option value="newest">Newest First</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
        </select>
        <input type="text" id="search-filter" class="text-input" placeholder="Search listings..." style="min-width:220px;" />
        <button class="btn btn-primary btn-sm" id="apply-filters-btn">Apply</button>
      </div>

      <div id="listings-grid" class="grid">
        <p class="text-muted">Loading listings...</p>
      </div>
    `;

    const initialType = params.get('type') || '';
    const initialSearch = params.get('search') || '';
    const initialCategory = params.get('category') || '';
    document.getElementById('search-filter').value = initialSearch;
    highlightTab(initialType);

    await loadCategories();
    if (initialCategory) {
      document.getElementById('category-filter').value = initialCategory;
      await loadSubcategoryOptions(initialCategory);
    }
    await loadListings({ type: initialType, search: initialSearch, category: initialCategory });

    document.querySelectorAll('#type-tabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        highlightTab(btn.dataset.type);
        renderCategoryOptions();
        applyFilters();
      });
    });

    document.getElementById('category-filter').addEventListener('change', (e) => {
      loadSubcategoryOptions(e.target.value);
    });

    document.getElementById('apply-filters-btn').addEventListener('click', applyFilters);
    document.getElementById('search-filter').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applyFilters();
    });
  });

  function highlightTab(type) {
    document.querySelectorAll('#type-tabs .tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.type === type);
    });
  }

  function getActiveType() {
    const active = document.querySelector('#type-tabs .tab-btn.active');
    return active ? active.dataset.type : '';
  }

  async function loadCategories() {
    try {
      const data = await apiRequest('/listings/categories');
      allCategories = data.categories || [];
      renderCategoryOptions();
    } catch (err) { /* fail silently, categories are optional filter */ }
  }

  function renderCategoryOptions() {
    const activeType = getActiveType();
    const wantedType = activeType === 'good' ? 'goods' : activeType === 'service' ? 'services' : null;
    const filtered = wantedType ? allCategories.filter(c => c.type === wantedType) : allCategories;

    const sel = document.getElementById('category-filter');
    const previousValue = sel.value;
    sel.innerHTML = `<option value="">All Categories</option>` +
      filtered.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

    // Keep the previous selection if it's still valid for the new type filter
    if (filtered.some(c => String(c.id) === previousValue)) {
      sel.value = previousValue;
      loadSubcategoryOptions(previousValue);
    } else {
      resetSubcategoryOptions();
    }
  }

  function resetSubcategoryOptions() {
    const subSel = document.getElementById('subcategory-filter');
    subSel.innerHTML = `<option value="">All Subcategories</option>`;
    subSel.disabled = true;
  }

  async function loadSubcategoryOptions(categoryId) {
    const subSel = document.getElementById('subcategory-filter');
    if (!categoryId) { resetSubcategoryOptions(); return; }
    subSel.innerHTML = `<option value="">Loading...</option>`;
    subSel.disabled = true;
    try {
      const data = await apiRequest(`/listings/subcategories/${categoryId}`);
      const subs = data.subcategories || [];
      subSel.innerHTML = `<option value="">All Subcategories</option>` +
        subs.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
      subSel.disabled = subs.length === 0;
    } catch (err) {
      resetSubcategoryOptions();
    }
  }

  function applyFilters() {
    const type = getActiveType();
    const category = document.getElementById('category-filter').value;
    const subcategory = document.getElementById('subcategory-filter').value;
    const sort = document.getElementById('sort-filter').value;
    const search = document.getElementById('search-filter').value.trim();
    loadListings({ type, category, subcategory, sort, search });
  }

  async function loadListings(filters = {}) {
    const grid = document.getElementById('listings-grid');
    grid.innerHTML = `<p class="text-muted">Loading listings...</p>`;
    const qs = new URLSearchParams();
    if (filters.type) qs.set('type', filters.type);
    if (filters.category) qs.set('category', filters.category);
    if (filters.subcategory) qs.set('subcategory', filters.subcategory);
    if (filters.sort) qs.set('sort', filters.sort);
    if (filters.search) qs.set('search', filters.search);

    try {
      const data = await apiRequest(`/listings?${qs.toString()}`);
      const listings = data.listings || [];
      if (listings.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <p>No listings match your filters.</p>
        </div>`;
        return;
      }
      grid.innerHTML = listings.map(listingCardHtml).join('');
    } catch (err) {
      grid.innerHTML = `<p class="text-muted">Could not load listings: ${err.message}</p>`;
    }
  }

  function listingCardHtml(l) {
    const img = l.image ? `<img src="${l.image}" alt="${l.title}" />` : placeholderIcon();
    const outOfStock = l.listing_type === 'good' && parseInt(l.quantity, 10) <= 0;
    return `
      <a href="listing.html?id=${l.id}" class="listing-card">
        <div class="listing-card-img">
          ${img}
          <span class="badge ${l.listing_type === 'good' ? 'badge-good' : 'badge-service'}">${l.listing_type === 'good' ? 'Good' : 'Service'}</span>
          ${outOfStock ? `<span class="badge-status rejected">Out of Stock</span>` : ''}
        </div>
        <div class="listing-card-body">
          <div class="listing-card-title">${escapeHtml(l.title)}</div>
          <div class="listing-card-price">${formatPrice(l.price)}</div>
          <div class="listing-card-meta">
            <span>${escapeHtml(l.subcategory_name || l.category_name || 'General')}</span>
            <span>${timeAgo(l.created_at)}</span>
          </div>
        </div>
      </a>
    `;
  }

  function placeholderIcon() {
    return `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
