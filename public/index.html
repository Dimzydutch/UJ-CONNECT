<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UJ Connect — Campus Marketplace</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="layout-root"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderLayout('home');
    document.getElementById('page-content').innerHTML = `
      <section class="hero">
        <h1>Buy, sell & offer services — right on campus.</h1>
        <p>UJ Connect is the marketplace built for UJ students. Sign up with your school email, list your goods or services, and connect with fellow students in minutes.</p>
        <div class="hero-actions">
          <a href="marketplace.html" class="btn btn-primary">Browse Marketplace</a>
          <a href="signup.html" class="btn btn-outline">Get Started Free</a>
        </div>
      </section>

      <div class="home-discover">
        <form class="home-search-bar" id="home-search-form">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="home-search-input" type="text" placeholder="Search product title..." />
        </form>
        <div class="category-pill-row" id="home-category-pills">
          <a href="marketplace.html" class="category-pill active">All Products</a>
        </div>
      </div>

      <div class="stat-grid">
        <div class="panel" style="text-align:center;">
          <div style="font-size:1.8rem;font-weight:800;color:var(--primary);">📦</div>
          <div class="stat-value">Goods</div>
          <div class="stat-label">Electronics, Food and Snacks, Cosmetics, furniture & more</div>
        </div>
        <div class="panel" style="text-align:center;">
          <div style="font-size:1.8rem;">🛠️</div>
          <div class="stat-value">Services</div>
          <div class="stat-label">Graphic Design, Web design, printing, hairdressing, delivery & more</div>
        </div>
        <div class="panel" style="text-align:center;">
          <div style="font-size:1.8rem;">🎓</div>
          <div class="stat-value">Verified Students</div>
          <div class="stat-label">School email sign-up keeps it on-campus</div>
        </div>
        <div class="panel" style="text-align:center;">
          <div style="font-size:1.8rem;">🛡️</div>
          <div class="stat-value">Moderated</div>
          <div class="stat-label">Admin-reviewed listings for safety</div>
        </div>
      </div>

      <div class="section-title-row">
        <h2>Recently Listed</h2>
        <a href="marketplace.html" class="btn btn-ghost btn-sm">View all →</a>
      </div>
      <div id="home-listings" class="grid">
        <p class="text-muted">Loading listings...</p>
      </div>

      <section id="about" class="panel" style="margin-top:40px;">
        <h2 class="mt-0">About UJ Connect</h2>
        <p class="text-muted">UJ Connect was built to give University of Jos students a safe, dedicated space to trade goods and offer services to one another. Every account is verified with a school email, and every listing passes through admin review before it goes live.</p>
      </section>

      <div class="footer-cta-banner">
        <div class="cta-pill-row">
          <a href="#" target="_blank" rel="noopener" class="cta-pill whatsapp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17 8a5 5 0 0 0-8.6 4.7L7 17l4.4-1.4A5 5 0 0 0 17 8z" opacity="0.3"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.3 14.8l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 0 1 12 4z"/><path d="M9.2 8.3c.2-.5.5-.5.7-.5h.5c.2 0 .4 0 .5.4.2.4.6 1.5.7 1.6.1.1.1.3 0 .4-.1.2-.1.2-.2.4l-.3.3c-.1.1-.2.2-.1.4.1.2.6.9 1.2 1.5.8.7 1.5 1 1.7 1.1.2.1.3.1.5-.1l.6-.7c.1-.2.3-.2.5-.1l1.4.7c.2.1.3.1.4.2.1.2.1.6-.1 1.1-.2.5-1.1 1-1.6 1-.4 0-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6-2.6-1.1-4.3-3.8-4.4-4-.1-.2-1-1.4-1-2.6 0-1.2.6-1.8.8-2z"/></svg>
            Join WhatsApp Channel
          </a>
          <a href="#" target="_blank" rel="noopener" class="cta-pill telegram">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M21.9 3.5 2.6 11c-1 .4-1 1.6.1 1.9l4.6 1.5 1.8 5.7c.2.7 1.1.9 1.6.4l2.6-2.5 4.8 3.5c.8.6 2 .2 2.2-.8l3.1-14.6c.2-1-.7-1.9-1.5-1.6zM8.8 14.3l-.4 3.6-1.4-4.5 9.8-6.8-8 7.7z"/></svg>
            Join Telegram Channel
          </a>
          <a href="#" class="cta-pill facebook" onclick="event.preventDefault();">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M13 22v-8h2.7l.4-3H13V9c0-.9.2-1.5 1.5-1.5H16V5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.3H7.5v3H9.8v8H13z"/></svg>
            Follow on Facebook (Coming soon)
          </a>
        </div>
        <p class="cta-subtitle">Vendors-only community · Updates · Tips · Support</p>
      </div>

      <footer class="site-footer-main">
        <div class="footer-grid">
          <div class="footer-brand-col">
            <div class="brand">
              <span class="logo-badge">UJ</span>
              <span>UJ Connect</span>
            </div>
            <p>The #1 campus marketplace for UJ students. Discover, buy, and sell with trust.</p>
            <div class="footer-built-by">
              <strong>Built by Matthew Oduwole</strong>
              <br />
              Need a website, MVP, or platform like this? <a href="mailto:hello@dimzydutch@gmail.com">Reach out.</a>
            </div>
          </div>
          <div class="footer-col">
            <h4>Explore</h4>
            <a href="marketplace.html">Marketplace</a>
            <a href="marketplace.html?type=service">Services</a>
            <a href="signup.html">Become a Seller</a>
          </div>
          <div class="footer-col">
            <h4>Account</h4>
            <a href="login.html">Log In</a>
            <a href="signup.html">Sign Up</a>
          </div>
          <div class="footer-col">
            <h4>Legal</h4>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="mailto:hello@dimzydutch@gmail.com">Contact Us</a>
          </div>
        </div>
        <div class="footer-bottom-bar">
          © ${new Date().getFullYear()} UJ Connect. All rights reserved. · <a href="#">Privacy Policy</a> · <a href="#">Terms of Service</a>
        </div>
      </footer>
    `;
    loadHomeListings();
    loadHomeCategoryPills();
    wireHomeSearch();
  });

  // A curated shortlist of major categories shown as quick-nav pills on the
  // homepage — not the full 23-category taxonomy, just the most common ones.
  const FEATURED_CATEGORY_NAMES = [
    'Electronics & Gadgets',
    'Fashion & Clothing',
    'Books & Educational Materials',
    'Food & Drinks',
    'Beauty & Personal Care',
    'Technology & Digital Services',
    'Academic Services'
  ];

  async function loadHomeCategoryPills() {
    const row = document.getElementById('home-category-pills');
    try {
      const data = await apiRequest('/listings/categories');
      const categories = data.categories || [];
      const featured = FEATURED_CATEGORY_NAMES
        .map(name => categories.find(c => c.name === name))
        .filter(Boolean);

      const pillsHtml = featured
        .map(c => `<a href="marketplace.html?category=${c.id}" class="category-pill">${escapeHtml(c.name)}</a>`)
        .join('');

      row.innerHTML = `<a href="marketplace.html" class="category-pill active">All Products</a>${pillsHtml}`;
    } catch (err) {
      // Keep just the "All Products" pill already in the markup if this fails
    }
  }

  function wireHomeSearch() {
    const form = document.getElementById('home-search-form');
    const input = document.getElementById('home-search-input');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (query) {
        window.location.href = `marketplace.html?search=${encodeURIComponent(query)}`;
      }
    });
  }

  async function loadHomeListings() {
    const el = document.getElementById('home-listings');
    try {
      const data = await apiRequest('/listings');
      const listings = (data.listings || []).slice(0, 8);
      if (listings.length === 0) {
        el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          <p>No listings yet. Be the first to <a href="signup.html" style="color:var(--primary);font-weight:700;">sign up</a> and post one!</p>
        </div>`;
        return;
      }
      el.innerHTML = listings.map(listingCardHtml).join('');
    } catch (err) {
      el.innerHTML = `<p class="text-muted">Could not load listings right now.</p>`;
    }
  }

  function listingCardHtml(l) {
    const img = l.image ? `<img src="${l.image}" alt="${l.title}" />` : placeholderIcon();
    return `
      <a href="listing.html?id=${l.id}" class="listing-card">
        <div class="listing-card-img">
          ${img}
          <span class="badge ${l.listing_type === 'good' ? 'badge-good' : 'badge-service'}">${l.listing_type === 'good' ? 'Good' : 'Service'}</span>
        </div>
        <div class="listing-card-body">
          <div class="listing-card-title">${escapeHtml(l.title)}</div>
          <div class="listing-card-price">${formatPrice(l.price)}</div>
          <div class="listing-card-meta">
            <span>${escapeHtml(l.category_name || 'General')}</span>
            <span>${timeAgo(l.created_at)}</span>
          </div>
        </div>
      </a>
    `;
  }

  function placeholderIcon() {
    return `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
