<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard — UJ Connect</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="layout-root"></div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
  let myCategories = [];
  let currentFullUser = null;

  document.addEventListener('DOMContentLoaded', async () => {
    requireAuth();
    renderLayout('dashboard');
    await loadFullProfile();
    buildDashboard();
    loadCategoriesForForm();
    loadMyListings();
    loadConversations();

    if (window.location.hash === '#upload') {
      setTimeout(() => handleNewListingClick(), 200);
    }
  });

  async function loadFullProfile() {
    try {
      const data = await apiRequest('/auth/me');
      currentFullUser = data.user;
    } catch (err) {
      currentFullUser = null;
    }
  }

  function buildDashboard() {
    const user = getUser();
    document.getElementById('page-content').innerHTML = `
      <div class="section-title-row">
        <h2>Welcome back, ${user.fullName.split(' ')[0]} 👋</h2>
        <button class="btn btn-primary" id="open-upload-btn">+ New Listing</button>
      </div>

      <div id="seller-profile-card-slot"></div>

      <div class="tabs" id="dash-tabs">
        <button class="tab-btn active" data-tab="listings">My Listings</button>
        <button class="tab-btn" data-tab="orders">Orders &amp; Payouts</button>
        <button class="tab-btn" data-tab="inbox">Messages</button>
        <button class="tab-btn" data-tab="security">Security</button>
      </div>

      <div id="tab-orders" class="hidden">
        <section class="panel payment-flow-panel">
          <h3>How orders and payments work</h3>
          <div class="payment-flow-grid">
            <div>
              <h4>Buyer</h4>
              <ol>
                <li>Send an order request. The seller must accept it and confirm any delivery fee.</li>
                <li>Pay the confirmed total through Paystack checkout.</li>
                <li>Receive the item or service, then select <strong>Confirm receipt &amp; release payout</strong>.</li>
              </ol>
              <p class="text-muted">Only confirm after you have received what you ordered. Your confirmation releases the seller's payout.</p>
            </div>
            <div>
              <h4>Seller</h4>
              <ol>
                <li>Link and verify your bank account below to receive payouts.</li>
                <li>Accept the order request and set the delivery fee, if applicable.</li>
                <li>Fulfil the order, then wait for the buyer to confirm receipt. The payout is sent to your linked account after confirmation.</li>
              </ol>
            </div>
          </div>
        </section>
        <section id="payout-account-section" class="panel" style="margin-bottom:20px;">
          <h3 style="margin-top:0;">Seller payout account</h3>
          <div id="payout-account-area"><p class="text-muted">Loading payout account...</p></div>
        </section>
        <div id="orders-list"><p class="text-muted">Loading orders...</p></div>
      </div>

      <div id="tab-listings">
        <div id="my-listings-grid" class="grid">
          <p class="text-muted">Loading your listings...</p>
        </div>
      </div>

      <div id="tab-inbox" class="hidden">
        <div id="messages-panel">
          <p class="text-muted">Loading conversations...</p>
        </div>
      </div>

      <div id="tab-security" class="hidden">
        <div class="panel" style="max-width:560px;">
          <h3 class="mt-0" style="font-size:1.05rem;">Two-Factor Authentication (2FA)</h3>
          <p class="text-muted" style="font-size:0.88rem;">Add an extra layer of security to your account. Once enabled, you'll need a code from an authenticator app (like Google Authenticator or Authy) every time you log in.</p>
          <div id="twofa-status-area">
            <p class="text-muted">Checking your 2FA status...</p>
          </div>
        </div>
      </div>
    `;

    document.getElementById('open-upload-btn').addEventListener('click', handleNewListingClick);
    renderSellerProfileCard();
    document.querySelectorAll('#dash-tabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#dash-tabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-listings').classList.toggle('hidden', btn.dataset.tab !== 'listings');
        document.getElementById('tab-inbox').classList.toggle('hidden', btn.dataset.tab !== 'inbox');
        document.getElementById('tab-security').classList.toggle('hidden', btn.dataset.tab !== 'security');
        document.getElementById('tab-orders').classList.toggle('hidden', btn.dataset.tab !== 'orders');
        if (btn.dataset.tab === 'security') loadTwoFAStatus();
        if (btn.dataset.tab === 'inbox') loadConversations();
        if (btn.dataset.tab === 'orders') loadPaymentDashboard();
      });
    });

    if (window.location.hash === '#orders') {
      document.querySelector('#dash-tabs .tab-btn[data-tab="orders"]').click();
    }
  }

  // ---------- Two-Factor Authentication ----------
  async function loadTwoFAStatus() {
    const area = document.getElementById('twofa-status-area');
    area.innerHTML = `<p class="text-muted">Checking your 2FA status...</p>`;
    try {
      const data = await apiRequest('/auth/2fa/status');
      if (data.enabled) {
        area.innerHTML = `
          <div class="alert alert-success">🔐 Two-factor authentication is <strong>enabled</strong> on your account.</div>
          <div class="flex gap-8" style="flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" id="regen-codes-btn">Regenerate Backup Codes</button>
            <button class="btn btn-danger btn-sm" id="disable-2fa-btn">Disable 2FA</button>
          </div>
        `;
        document.getElementById('disable-2fa-btn').addEventListener('click', showDisable2FAForm);
        document.getElementById('regen-codes-btn').addEventListener('click', showRegenerateCodesForm);
      } else {
        area.innerHTML = `
          <div class="alert" style="background:var(--surface-2);color:var(--text);">Two-factor authentication is currently <strong>off</strong>.</div>
          <button class="btn btn-primary btn-sm" id="enable-2fa-btn">Enable Two-Factor Authentication</button>
        `;
        document.getElementById('enable-2fa-btn').addEventListener('click', startTwoFASetup);
      }
    } catch (err) {
      area.innerHTML = `<p class="text-muted">Could not load 2FA status: ${err.message}</p>`;
    }
  }

  async function startTwoFASetup() {
    const area = document.getElementById('twofa-status-area');
    area.innerHTML = `<p class="text-muted">Generating your setup code...</p>`;
    try {
      const data = await apiRequest('/auth/2fa/setup', { method: 'POST' });
      area.innerHTML = `
        <p style="font-size:0.88rem;">1. Scan this QR code with your authenticator app:</p>
        <img src="${data.qrCode}" alt="2FA QR Code" style="width:180px;height:180px;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;" />
        <p class="text-muted" style="font-size:0.8rem;">Can't scan? Enter this code manually: <code style="background:var(--surface-2);padding:2px 6px;border-radius:4px;">${data.secret}</code></p>
        <div class="form-group" style="margin-top:14px;">
          <label for="confirm-2fa-code">2. Enter the 6-digit code it generates:</label>
          <input type="text" id="confirm-2fa-code" class="text-input w-full" placeholder="123456" autocomplete="one-time-code" />
        </div>
        <div id="setup-2fa-alert"></div>
        <div class="flex gap-8">
          <button class="btn btn-primary btn-sm" id="confirm-2fa-btn">Confirm & Enable</button>
          <button class="btn btn-ghost btn-sm" id="cancel-2fa-setup-btn">Cancel</button>
        </div>
      `;
      document.getElementById('cancel-2fa-setup-btn').addEventListener('click', loadTwoFAStatus);
      document.getElementById('confirm-2fa-btn').addEventListener('click', async () => {
        const code = document.getElementById('confirm-2fa-code').value.trim();
        const alertBox = document.getElementById('setup-2fa-alert');
        alertBox.innerHTML = '';
        if (!code) { alertBox.innerHTML = `<div class="alert alert-error">Please enter the code from your app.</div>`; return; }
        try {
          const result = await apiRequest('/auth/2fa/enable', { method: 'POST', body: { code } });
          showBackupCodes(result.backupCodes, 'Two-factor authentication is now enabled! Save these backup codes somewhere safe — each can be used once if you lose access to your authenticator app.');
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        }
      });
    } catch (err) {
      area.innerHTML = `<p class="text-muted">Could not start 2FA setup: ${err.message}</p>`;
    }
  }

  function showBackupCodes(codes, message) {
    const area = document.getElementById('twofa-status-area');
    area.innerHTML = `
      <div class="alert alert-success">${message}</div>
      <div class="panel" style="background:var(--surface-2);margin-bottom:14px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:monospace;font-size:0.92rem;">
          ${codes.map(c => `<div>${c}</div>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary btn-sm" id="done-2fa-btn">Done</button>
    `;
    document.getElementById('done-2fa-btn').addEventListener('click', loadTwoFAStatus);
  }

  function showDisable2FAForm() {
    const area = document.getElementById('twofa-status-area');
    area.innerHTML = `
      <p class="text-muted" style="font-size:0.86rem;">Confirm your password and a current code to disable 2FA.</p>
      <div class="form-group">
        <label for="disable-password">Password</label>
        <input type="password" id="disable-password" class="text-input w-full" />
      </div>
      <div class="form-group">
        <label for="disable-code">Verification Code</label>
        <input type="text" id="disable-code" class="text-input w-full" placeholder="123456 or backup code" />
      </div>
      <div id="disable-2fa-alert"></div>
      <div class="flex gap-8">
        <button class="btn btn-danger btn-sm" id="confirm-disable-btn">Disable 2FA</button>
        <button class="btn btn-ghost btn-sm" id="cancel-disable-btn">Cancel</button>
      </div>
    `;
    document.getElementById('cancel-disable-btn').addEventListener('click', loadTwoFAStatus);
    document.getElementById('confirm-disable-btn').addEventListener('click', async () => {
      const password = document.getElementById('disable-password').value;
      const code = document.getElementById('disable-code').value.trim();
      const alertBox = document.getElementById('disable-2fa-alert');
      alertBox.innerHTML = '';
      if (!password || !code) { alertBox.innerHTML = `<div class="alert alert-error">Both fields are required.</div>`; return; }
      try {
        await apiRequest('/auth/2fa/disable', { method: 'POST', body: { password, code } });
        showToast('Two-factor authentication disabled.', 'success');
        loadTwoFAStatus();
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  }

  function showRegenerateCodesForm() {
    const area = document.getElementById('twofa-status-area');
    area.innerHTML = `
      <p class="text-muted" style="font-size:0.86rem;">Enter a current code to generate a fresh set of backup codes. Your old codes will stop working.</p>
      <div class="form-group">
        <label for="regen-code">Verification Code</label>
        <input type="text" id="regen-code" class="text-input w-full" placeholder="123456" />
      </div>
      <div id="regen-2fa-alert"></div>
      <div class="flex gap-8">
        <button class="btn btn-primary btn-sm" id="confirm-regen-btn">Generate New Codes</button>
        <button class="btn btn-ghost btn-sm" id="cancel-regen-btn">Cancel</button>
      </div>
    `;
    document.getElementById('cancel-regen-btn').addEventListener('click', loadTwoFAStatus);
    document.getElementById('confirm-regen-btn').addEventListener('click', async () => {
      const code = document.getElementById('regen-code').value.trim();
      const alertBox = document.getElementById('regen-2fa-alert');
      alertBox.innerHTML = '';
      if (!code) { alertBox.innerHTML = `<div class="alert alert-error">Please enter a code.</div>`; return; }
      try {
        const result = await apiRequest('/auth/2fa/backup-codes/regenerate', { method: 'POST', body: { code } });
        showBackupCodes(result.backupCodes, 'New backup codes generated. Your old codes no longer work.');
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  }

  // ---------- Seller Profile ----------
  function renderSellerProfileCard() {
    const slot = document.getElementById('seller-profile-card-slot');
    if (!slot) return;

    if (currentFullUser && currentFullUser.is_seller) {
      slot.innerHTML = `
        <div class="seller-profile-card">
          <div class="buy-sell-icon-badge">🏷️</div>
          <div style="flex:1;">
            <div style="font-weight:700;">You're set up as a seller</div>
            <p class="text-muted preserve-line-breaks" style="font-size:0.85rem;margin:4px 0 0;">${escapeHtml(currentFullUser.seller_bio || '')}</p>
            <p class="text-muted" style="font-size:0.8rem;margin:4px 0 0;">📞 ${escapeHtml(currentFullUser.phone || '')}</p>
          </div>
          <button class="btn btn-ghost btn-sm" id="edit-seller-profile-btn">Edit Profile</button>
        </div>
      `;
      document.getElementById('edit-seller-profile-btn').addEventListener('click', () => openSellerProfileModal());
    } else {
      slot.innerHTML = `
        <div class="seller-profile-card">
          <div class="buy-sell-icon-badge">🛍️</div>
          <div style="flex:1;">
            <div style="font-weight:700;">Ready to start selling?</div>
            <p class="text-muted" style="font-size:0.85rem;margin:4px 0 0;">Set up your seller profile to list goods or services on UJ Connect.</p>
          </div>
          <button class="btn btn-primary btn-sm" id="become-seller-btn">Become a Seller</button>
        </div>
      `;
      document.getElementById('become-seller-btn').addEventListener('click', () => openSellerProfileModal());
    }
  }

  // Gate listing creation on having a seller profile
  function handleNewListingClick() {
    if (currentFullUser && currentFullUser.is_seller) {
      openUploadModal();
    } else {
      openSellerProfileModal(true);
    }
  }

  function openSellerProfileModal(thenOpenUpload = false) {
    const isEditing = currentFullUser && currentFullUser.is_seller;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>${isEditing ? 'Edit Seller Profile' : 'Become a Seller'}</h3>
          <button class="modal-close" id="close-seller-modal">✕</button>
        </div>
        ${!isEditing ? `
          <div class="form-group">
            <label>What would you like to do?</label>
            <div class="buy-sell-toggle">
              <div class="buy-sell-option disabled" title="Just browsing? No setup needed — head to the Marketplace.">
                <span class="buy-sell-icon">🛍️</span>
                <span class="buy-sell-label">Buy</span>
              </div>
              <div class="buy-sell-option selected" id="sell-option">
                <span class="buy-sell-icon">🏷️</span>
                <span class="buy-sell-label">Sell</span>
              </div>
            </div>
          </div>
        ` : ''}
        <div class="form-group">
          <label for="seller-bio-input">Describe what you sell</label>
          <textarea id="seller-bio-input" class="text-input w-full" rows="3" placeholder="e.g. I sell secondhand textbooks, phone accessories, and offer tutoring in Maths and Physics.">${escapeHtml((currentFullUser && currentFullUser.seller_bio) || '')}</textarea>
        </div>
        <div class="form-group">
          <label for="seller-phone-input">Phone Number</label>
          <input type="tel" id="seller-phone-input" class="text-input w-full" placeholder="08x xxx xxxx" value="${escapeHtml((currentFullUser && currentFullUser.phone) || '')}" />
          <div class="hint">Shown to buyers on your listings so they can reach you.</div>
        </div>
        ${!isEditing ? `
          <div class="form-row-2">
            <div class="form-group">
              <label for="seller-bank-select">Nigerian bank</label>
              <select id="seller-bank-select" class="select-input w-full" required>
                <option value="">Loading banks...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="seller-account-number">Account number</label>
              <input id="seller-account-number" class="text-input w-full" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="10 digits" required />
            </div>
          </div>
          <p class="text-muted" style="font-size:0.82rem;">Paystack verifies your account. UJ Connect stores only the recipient code and masked account details.</p>
          <button type="button" class="btn btn-outline btn-sm" id="verify-seller-bank-btn" disabled>Verify bank account</button>
        ` : ''}
        <div id="seller-profile-alert"></div>
        <button class="btn btn-primary btn-block" id="save-seller-profile-btn">${isEditing ? 'Save Changes' : 'Save & Continue'}</button>
      </div>
    `;
    document.body.appendChild(backdrop);

    document.getElementById('close-seller-modal').addEventListener('click', () => backdrop.remove());
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

    let verifiedSellerBank = null;
    if (!isEditing) {
      const bankSelect = document.getElementById('seller-bank-select');
      const accountNumberInput = document.getElementById('seller-account-number');
      const verifyButton = document.getElementById('verify-seller-bank-btn');
      const alertBox = document.getElementById('seller-profile-alert');
      apiRequest('/payments/banks').then(data => {
        bankSelect.innerHTML = '<option value="">Choose your bank</option>' +
          (data.banks || []).map(bank => `<option value="${escapeHtml(bank.code)}">${escapeHtml(bank.name)}</option>`).join('');
        verifyButton.disabled = false;
      }).catch(err => {
        alertBox.innerHTML = `<div class="alert alert-error">Could not load banks: ${escapeHtml(err.message)}</div>`;
      });

      const clearVerification = () => {
        verifiedSellerBank = null;
        alertBox.innerHTML = '';
        verifyButton.textContent = 'Verify bank account';
      };
      bankSelect.addEventListener('change', clearVerification);
      accountNumberInput.addEventListener('input', clearVerification);
      verifyButton.addEventListener('click', async () => {
        const bankCode = bankSelect.value;
        const accountNumber = accountNumberInput.value.trim();
        if (!bankCode || !/^\d{10}$/.test(accountNumber)) {
          alertBox.innerHTML = '<div class="alert alert-error">Choose a bank and enter a valid 10-digit account number.</div>';
          return;
        }
        verifyButton.disabled = true;
        try {
          const result = await apiRequest('/payments/bank-account/resolve', {
            method: 'POST', body: { bankCode, accountNumber }
          });
          verifiedSellerBank = { bankCode, accountNumber, accountName: result.accountName };
          alertBox.innerHTML = `<div class="alert alert-success">Paystack verified: <strong>${escapeHtml(result.accountName)}</strong> · ${escapeHtml(result.bankName)}. Confirm this is your account when you continue.</div>`;
          verifyButton.textContent = 'Account verified';
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
        } finally {
          verifyButton.disabled = false;
        }
      });
    }

    document.getElementById('save-seller-profile-btn').addEventListener('click', async () => {
      const sellerBio = document.getElementById('seller-bio-input').value.trim();
      const phone = document.getElementById('seller-phone-input').value.trim();
      const alertBox = document.getElementById('seller-profile-alert');
      alertBox.innerHTML = '';

      if (!sellerBio) { alertBox.innerHTML = `<div class="alert alert-error">Please describe what you sell.</div>`; return; }
      if (!phone || phone.length < 7) { alertBox.innerHTML = `<div class="alert alert-error">Please enter a valid phone number.</div>`; return; }
      if (!isEditing) {
        const bankCode = document.getElementById('seller-bank-select').value;
        const accountNumber = document.getElementById('seller-account-number').value.trim();
        if (!verifiedSellerBank || verifiedSellerBank.bankCode !== bankCode || verifiedSellerBank.accountNumber !== accountNumber) {
          alertBox.innerHTML = '<div class="alert alert-error">Verify your bank account before completing seller setup.</div>';
          return;
        }
      }

      const btn = document.getElementById('save-seller-profile-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        if (isEditing) {
          await apiRequest('/auth/seller-profile', { method: 'PUT', body: { sellerBio, phone } });
        } else {
          await apiRequest('/payments/seller-onboarding', {
            method: 'PUT',
            body: {
              sellerBio,
              phone,
              bankCode: verifiedSellerBank.bankCode,
              accountNumber: verifiedSellerBank.accountNumber,
              confirmedAccountName: verifiedSellerBank.accountName
            }
          });
        }
        await loadFullProfile();
        renderSellerProfileCard();
        showToast('Seller profile saved!', 'success');
        backdrop.remove();
        if (thenOpenUpload) openUploadModal();
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = isEditing ? 'Save Changes' : 'Save & Continue';
      }
    });
  }

  async function loadCategoriesForForm() {
    try {
      const data = await apiRequest('/listings/categories');
      myCategories = data.categories || [];
    } catch (err) { /* ignore */ }
  }

  async function loadMyListings() {
    const grid = document.getElementById('my-listings-grid');
    try {
      const data = await apiRequest('/listings/mine');
      const listings = data.listings || [];
      if (listings.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>You haven't listed anything yet.</p>
          <button class="btn btn-primary btn-sm" onclick="handleNewListingClick()" style="margin-top:10px;">Create your first listing</button>
        </div>`;
        return;
      }
      grid.innerHTML = listings.map(myListingCardHtml).join('');
    } catch (err) {
      grid.innerHTML = `<p class="text-muted">Could not load your listings: ${err.message}</p>`;
    }
  }

  function myListingCardHtml(l) {
    const img = l.image ? `<img src="${l.image}" alt="${l.title}" />` : placeholderIcon();
    return `
      <div class="listing-card">
        <div class="listing-card-img">
          ${img}
          <span class="badge ${l.listing_type === 'good' ? 'badge-good' : 'badge-service'}">${l.listing_type === 'good' ? 'Good' : 'Service'}</span>
          <span class="badge-status ${l.status}">${l.status}</span>
        </div>
        <div class="listing-card-body">
          <div class="listing-card-title">${escapeHtml(l.title)}</div>
          <div class="listing-card-price">${formatPrice(l.price)}</div>
          <div class="listing-card-meta">
            <span>${escapeHtml(l.category_name || 'General')}${l.listing_type === 'good' ? ' · ' + l.quantity + ' in stock' : ''}</span>
            <span>${timeAgo(l.created_at)}</span>
          </div>
          <div class="listing-card-actions">
            ${l.status !== 'sold' ? `<button class="btn btn-ghost btn-sm" onclick="markSold(${l.id})">Mark Sold</button>` : ''}
            <button class="btn btn-outline btn-sm" onclick="deleteListing(${l.id})">Delete</button>
          </div>
        </div>
      </div>
    `;
  }

  async function markSold(id) {
    try {
      await apiRequest(`/listings/${id}/sold`, { method: 'PATCH' });
      showToast('Listing marked as sold.', 'success');
      loadMyListings();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function deleteListing(id) {
    if (!confirm('Are you sure you want to delete this listing? This cannot be undone.')) return;
    try {
      await apiRequest(`/listings/${id}`, { method: 'DELETE' });
      showToast('Listing deleted.', 'success');
      loadMyListings();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function loadPaymentDashboard() {
    const accountSection = document.getElementById('payout-account-section');
    const accountArea = document.getElementById('payout-account-area');
    if (currentFullUser && currentFullUser.is_seller) {
      try {
        const data = await apiRequest('/payments/bank-account');
        const account = data.account;
        accountArea.innerHTML = account.linked
          ? `<p><strong>${escapeHtml(account.accountName)}</strong><br /><span class="text-muted">${escapeHtml(account.bankName)} · account ending ${escapeHtml(account.last4)}</span></p>
             <button class="btn btn-outline btn-sm" id="edit-payout-account-btn">Update payout account</button>`
          : `<p class="text-muted">Link and verify a Nigerian bank account to receive seller payouts.</p>
             <button class="btn btn-primary btn-sm" id="edit-payout-account-btn">Link bank account</button>`;
        document.getElementById('edit-payout-account-btn').addEventListener('click', openPayoutAccountForm);
      } catch (err) {
        accountArea.innerHTML = `<p class="text-muted">${escapeHtml(err.message)}</p>`;
      }
    } else {
      accountSection.classList.add('hidden');
    }

    const ordersArea = document.getElementById('orders-list');
    ordersArea.innerHTML = `<p class="text-muted">Loading orders...</p>`;
    try {
      const data = await apiRequest('/payments/orders');
      renderPaymentOrders(ordersArea, data.orders || []);
    } catch (err) {
      ordersArea.innerHTML = `<p class="text-muted">Could not load orders: ${escapeHtml(err.message)}</p>`;
    }
  }

  async function openPayoutAccountForm() {
    const accountArea = document.getElementById('payout-account-area');
    let verifiedAccount = null;
    accountArea.innerHTML = `<p class="text-muted">Loading Nigerian banks...</p>`;
    try {
      const data = await apiRequest('/payments/banks');
      accountArea.innerHTML = `
        <div class="form-row-2">
          <div class="form-group">
            <label for="payout-bank-select">Bank</label>
            <select id="payout-bank-select" class="select-input w-full" required>
              <option value="">Choose your bank</option>
              ${(data.banks || []).map(bank => `<option value="${escapeHtml(bank.code)}">${escapeHtml(bank.name)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label for="payout-account-number">Account number</label>
            <input id="payout-account-number" class="text-input w-full" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="10 digits" required />
          </div>
        </div>
        <p class="text-muted" style="font-size:0.82rem;">Paystack verifies the account. UJ Connect stores only the Paystack recipient code and masked account details, not the account number.</p>
        <div id="payout-account-alert"></div>
        <button class="btn btn-primary btn-sm" id="save-payout-account-btn">Verify bank account</button>
        <button class="btn btn-ghost btn-sm" id="cancel-payout-account-btn">Cancel</button>
      `;
      document.getElementById('cancel-payout-account-btn').addEventListener('click', loadPaymentDashboard);
      document.getElementById('save-payout-account-btn').addEventListener('click', async () => {
        const bankCode = document.getElementById('payout-bank-select').value;
        const accountNumber = document.getElementById('payout-account-number').value.trim();
        const alert = document.getElementById('payout-account-alert');
        const button = document.getElementById('save-payout-account-btn');
        if (!bankCode || !/^\d{10}$/.test(accountNumber)) {
          verifiedAccount = null;
          alert.innerHTML = `<div class="alert alert-error">Choose a bank and enter a valid 10-digit account number.</div>`;
          return;
        }
        button.disabled = true;
        try {
          if (!verifiedAccount || verifiedAccount.bankCode !== bankCode || verifiedAccount.accountNumber !== accountNumber) {
            alert.innerHTML = '';
            const resolved = await apiRequest('/payments/bank-account/resolve', { method: 'POST', body: { bankCode, accountNumber } });
            verifiedAccount = { bankCode, accountNumber, accountName: resolved.accountName };
            alert.innerHTML = `<div class="alert alert-success">Paystack verified: <strong>${escapeHtml(resolved.accountName)}</strong> · ${escapeHtml(resolved.bankName)}. Verify this is your account before linking it.</div>`;
            button.textContent = 'Confirm name and link account';
            button.disabled = false;
            return;
          }
          await apiRequest('/payments/bank-account', {
            method: 'PUT',
            body: { bankCode, accountNumber, confirmedAccountName: verifiedAccount.accountName }
          });
          showToast('Bank account verified and linked.', 'success');
          loadPaymentDashboard();
        } catch (err) {
          alert.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
          button.disabled = false;
        }
      });
      document.getElementById('payout-bank-select').addEventListener('change', () => { verifiedAccount = null; document.getElementById('save-payout-account-btn').textContent = 'Verify bank account'; });
      document.getElementById('payout-account-number').addEventListener('input', () => { verifiedAccount = null; document.getElementById('save-payout-account-btn').textContent = 'Verify bank account'; });
    } catch (err) {
      accountArea.innerHTML = `<p class="text-muted">Could not load banks: ${escapeHtml(err.message)}</p>`;
    }
  }

  function renderPaymentOrders(container, orders) {
    if (!orders.length) {
      container.innerHTML = `<div class="empty-state"><p>No orders yet. Buyer requests and seller orders will appear here.</p></div>`;
      return;
    }

    const statusLabels = {
      requested: 'Waiting for seller response',
      awaiting_payment: 'Ready for payment',
      paid: 'Payment received, awaiting delivery confirmation',
      payout_pending: 'Seller payout processing',
      payout_failed: 'Payout needs attention',
      completed: 'Completed',
      rejected: 'Declined by seller',
      cancelled: 'Expired or cancelled',
      refund_required: 'Refund processing; contact support if delayed'
    };
    container.innerHTML = orders.map(order => {
      const role = order.viewer_role;
      const otherPerson = role === 'buyer' ? order.seller_name : order.buyer_name;
      const total = order.total_amount || order.item_subtotal;
      let controls = '';

      if (role === 'seller' && order.status === 'requested') {
        controls = `
          ${order.delivery_method === 'delivery' ? `<div class="form-group" style="max-width:240px;"><label for="delivery-fee-${order.id}">Delivery fee (₦)</label><input id="delivery-fee-${order.id}" class="text-input w-full" type="number" min="0" step="0.01" value="0" required /></div>` : `<p class="text-muted">${order.delivery_method === 'pickup' ? `Pickup: ${escapeHtml(order.meeting_spot || '')}` : 'Service request'}</p>`}
          <div class="flex gap-8">
            <button class="btn btn-primary btn-sm order-accept-btn" data-order-id="${order.id}">Accept &amp; quote</button>
            <button class="btn btn-outline btn-sm order-reject-btn" data-order-id="${order.id}">Decline</button>
          </div>`;
      } else if (role === 'buyer' && order.status === 'awaiting_payment') {
        controls = `<p class="text-muted">Items ${formatPrice(order.item_subtotal)} · Delivery ${formatPrice(order.delivery_fee)} · Total ${formatPrice(total)}</p>
          <button class="btn btn-primary btn-sm order-pay-btn" data-order-id="${order.id}">Pay with Paystack</button>`;
      } else if (role === 'buyer' && order.status === 'paid') {
        controls = `<p class="text-muted">Only confirm after you have received the item or service.</p>
          <button class="btn btn-primary btn-sm order-confirm-btn" data-order-id="${order.id}">Confirm receipt &amp; release payout</button>`;
      } else if (role === 'seller' && order.status === 'payout_failed') {
        controls = `<button class="btn btn-outline btn-sm order-retry-payout-btn" data-order-id="${order.id}">Retry payout</button>`;
      }

      const fulfilment = order.delivery_method === 'delivery'
        ? `<p><strong>Delivery address:</strong> ${escapeHtml(order.delivery_address || '')}</p>`
        : order.delivery_method === 'pickup'
          ? `<p><strong>Meeting spot:</strong> ${escapeHtml(order.meeting_spot || '')}</p>`
          : `<p><strong>Order type:</strong> Service</p>`;
      return `<article class="panel payment-order-card">
        <div class="payment-order-heading"><div><h3>${escapeHtml(order.listing_title)}</h3><p class="text-muted">${role === 'buyer' ? 'Seller' : 'Buyer'}: ${escapeHtml(otherPerson)} · Qty ${order.quantity}</p></div>
          <span class="badge-status ${escapeHtml(order.status)}">${escapeHtml(statusLabels[order.status] || order.status)}</span></div>
        ${fulfilment}
        ${order.buyer_note ? `<p class="preserve-line-breaks"><strong>Note:</strong> ${escapeHtml(order.buyer_note)}</p>` : ''}
        <p><strong>Total:</strong> ${formatPrice(total)}${role === 'seller' && order.status !== 'requested' ? ` · <strong>Estimated seller payout:</strong> ${formatPrice(order.seller_amount)}${order.status === 'awaiting_payment' ? ' before Paystack processing fee' : order.paystack_fee > 0 ? ` after ${formatPrice(order.paystack_fee)} Paystack fee` : ''}` : ''}</p>
        ${controls}
        <p class="text-muted payment-order-date">${timeAgo(order.created_at)}</p>
      </article>`;
    }).join('');

    container.querySelectorAll('.order-accept-btn').forEach(button => button.addEventListener('click', () => respondToOrder(button.dataset.orderId, 'accept')));
    container.querySelectorAll('.order-reject-btn').forEach(button => button.addEventListener('click', () => respondToOrder(button.dataset.orderId, 'reject')));
    container.querySelectorAll('.order-pay-btn').forEach(button => button.addEventListener('click', () => payForOrder(button.dataset.orderId)));
    container.querySelectorAll('.order-confirm-btn').forEach(button => button.addEventListener('click', () => confirmOrderReceived(button.dataset.orderId)));
    container.querySelectorAll('.order-retry-payout-btn').forEach(button => button.addEventListener('click', () => retryOrderPayout(button.dataset.orderId)));
  }

  async function respondToOrder(orderId, action) {
    const deliveryFee = document.getElementById(`delivery-fee-${orderId}`);
    try {
      await apiRequest(`/payments/orders/${orderId}/quote`, {
        method: 'PATCH',
        body: { action, deliveryFee: deliveryFee ? deliveryFee.value : '0' }
      });
      showToast(action === 'accept' ? 'Order accepted. The buyer can now pay.' : 'Order declined.', 'success');
      loadPaymentDashboard();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function payForOrder(orderId) {
    try {
      const result = await apiRequest(`/payments/orders/${orderId}/checkout`, { method: 'POST' });
      window.location.href = result.authorizationUrl;
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function confirmOrderReceived(orderId) {
    if (!confirm('Confirm that you have received the item or service? This releases the seller payout.')) return;
    try {
      const result = await apiRequest(`/payments/orders/${orderId}/confirm-received`, { method: 'POST' });
      showToast(result.message, result.status === 'completed' ? 'success' : 'info');
      loadPaymentDashboard();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function retryOrderPayout(orderId) {
    try {
      const result = await apiRequest(`/payments/orders/${orderId}/retry-payout`, { method: 'POST' });
      showToast(result.message, 'info');
      loadPaymentDashboard();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // ---------- Messages: conversation list + thread ----------
  async function loadConversations() {
    const panel = document.getElementById('messages-panel');
    panel.innerHTML = `<p class="text-muted">Loading conversations...</p>`;
    try {
      const data = await apiRequest('/messages/conversations');
      const conversations = data.conversations || [];
      if (conversations.length === 0) {
        panel.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
          <p>No conversations yet. Messages from buyers and sellers will show up here.</p>
        </div>`;
        return;
      }
      panel.innerHTML = `<div class="conversation-list">${conversations.map(conversationItemHtml).join('')}</div>`;
      panel.querySelectorAll('.conversation-item').forEach(el => {
        el.addEventListener('click', () => {
          openThread(el.dataset.listingId, el.dataset.otherUserId, el.dataset.otherUserName, el.dataset.listingTitle);
        });
      });
    } catch (err) {
      panel.innerHTML = `<p class="text-muted">Could not load conversations: ${err.message}</p>`;
    }
  }

  function conversationItemHtml(c) {
    const preview = (c.lastMessageFromMe ? 'You: ' : '') + c.lastMessage;
    return `
      <div class="conversation-item" data-listing-id="${c.listingId}" data-other-user-id="${c.otherUserId}" data-other-user-name="${escapeHtml(c.otherUserName)}" data-listing-title="${escapeHtml(c.listingTitle)}">
        <span class="avatar-circle">${initials(c.otherUserName)}</span>
        <div class="conversation-meta">
          <div class="conversation-top-row">
            <span class="conversation-name">${escapeHtml(c.otherUserName)}</span>
            <span class="conversation-time">${timeAgo(c.lastMessageAt)}</span>
          </div>
          <div class="conversation-listing">${escapeHtml(c.listingTitle)}</div>
          <div class="conversation-preview">${escapeHtml(preview)}</div>
        </div>
        ${c.unreadCount > 0 ? '<span class="unread-dot"></span>' : ''}
      </div>
    `;
  }

  async function openThread(listingId, otherUserId, otherUserName, listingTitle) {
    const panel = document.getElementById('messages-panel');
    panel.innerHTML = `<p class="text-muted">Loading conversation...</p>`;
    try {
      const data = await apiRequest(`/messages/thread/${listingId}/${otherUserId}`);
      const currentUser = getUser();
      const messages = data.messages || [];
      panel.innerHTML = `
        <div class="thread-wrap">
          <div class="thread-header">
            <div>
              <div style="font-weight:700;">${escapeHtml(otherUserName)}</div>
              <div class="text-muted" style="font-size:0.78rem;">${escapeHtml(listingTitle)}</div>
            </div>
            <button class="btn btn-ghost btn-sm" id="back-to-conversations-btn">← Back</button>
          </div>
          <div class="thread-messages" id="thread-messages">
            ${messages.map(m => threadBubbleHtml(m, currentUser.id)).join('')}
          </div>
          <div class="thread-input-row">
            <textarea id="thread-reply-input" class="text-input" rows="1" placeholder="Type a message..."></textarea>
            <button class="btn btn-primary btn-sm" id="thread-send-btn">Send</button>
          </div>
        </div>
      `;
      document.getElementById('back-to-conversations-btn').addEventListener('click', loadConversations);
      const messagesEl = document.getElementById('thread-messages');
      messagesEl.scrollTop = messagesEl.scrollHeight;

      const sendReply = async () => {
        const input = document.getElementById('thread-reply-input');
        const text = input.value.trim();
        if (!text) return;
        const btn = document.getElementById('thread-send-btn');
        btn.disabled = true;
        try {
          await apiRequest('/messages', { method: 'POST', body: { listingId, receiverId: otherUserId, message: text } });
          input.value = '';
          openThread(listingId, otherUserId, otherUserName, listingTitle);
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
        }
      };
      document.getElementById('thread-send-btn').addEventListener('click', sendReply);
      document.getElementById('thread-reply-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
      });
    } catch (err) {
      panel.innerHTML = `<p class="text-muted">Could not load conversation: ${err.message}</p>`;
    }
  }

  function threadBubbleHtml(m, currentUserId) {
    const mine = m.sender_id === currentUserId;
    return `
      <div class="thread-bubble ${mine ? 'mine' : 'theirs'}">
        ${escapeHtml(m.message)}
        <span class="thread-bubble-time">${timeAgo(m.created_at)}</span>
      </div>
    `;
  }

  // ---------- Upload Modal ----------
  function openUploadModal() {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Create New Listing</h3>
          <button class="modal-close" id="close-upload-modal">✕</button>
        </div>
        <form id="upload-form">
          <div class="form-group">
            <label>Listing Type</label>
            <div class="tabs">
              <button type="button" class="tab-btn active" data-listing-type="good">📦 Good</button>
              <button type="button" class="tab-btn" data-listing-type="service">🛠️ Service</button>
            </div>
          </div>
          <div class="form-group">
            <label for="listing-title">Title</label>
            <input type="text" id="listing-title" class="text-input w-full" placeholder="e.g. Calculus Textbook 2nd Edition" required />
          </div>
          <div class="form-row-2">
            <div class="form-group">
              <label for="listing-price">Price (₦)</label>

            </div>
            <div class="form-group" id="condition-group">
              <label for="listing-condition">Condition</label>
              <select id="listing-condition" class="select-input w-full">
                <option value="">Select condition</option>
                <option value="brand_new">Brand New</option>
                <option value="used">Used</option>
              </select>
            </div>
          </div>
          <div class="form-row-2">
            <div class="form-group">
              <label for="listing-category">Category</label>
              <select id="listing-category" class="select-input w-full">
                <option value="">Select category</option>
              </select>
            </div>
            <div class="form-group">
              <label for="listing-subcategory">Subcategory</label>
              <select id="listing-subcategory" class="select-input w-full" disabled>
                <option value="">Select category first</option>
              </select>
            </div>
          </div>
          <div class="form-row-2">
            <div class="form-group">
              <label for="listing-location">Location / Pickup Point</label>
              <input type="text" id="listing-location" class="text-input w-full" placeholder="e.g. Naraguta Campus" />
            </div>
            <div class="form-group" id="quantity-group">
              <label for="listing-quantity">Quantity Available</label>
              <input type="number" id="listing-quantity" class="text-input w-full" min="1" step="1" value="1" />
            </div>
          </div>
          <div class="form-group">
            <label for="listing-description">Description</label>
            <textarea id="listing-description" class="text-input w-full" rows="4" placeholder="Describe your item or service in detail..."></textarea>
          </div>
          <div class="form-group">
            <label>Photos (optional, up to 5)</label>
            <div class="photo-source-row">
              <div class="photo-source-btn">
                <span class="photo-source-icon">🖼️</span>
                <span class="photo-source-label">Choose from Gallery</span>
                <input type="file" id="listing-images-gallery" accept="image/*" multiple />
              </div>
              <div class="photo-source-btn">
                <span class="photo-source-icon">📷</span>
                <span class="photo-source-label">Take a Photo</span>
                <input type="file" id="listing-images-camera" accept="image/*" capture="environment" />
              </div>
            </div>
            <div class="image-preview-grid" id="image-preview-grid"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submit-listing-btn">Submit Listing for Review</button>
        </form>
      </div>
    `;
    document.body.appendChild(backdrop);

    let listingType = 'good';
    let selectedFiles = [];

    function populateCategoryOptions() {
      const wantedType = listingType === 'service' ? 'services' : 'goods';
      const filtered = myCategories.filter(c => c.type === wantedType);
      const select = document.getElementById('listing-category');
      select.innerHTML = `<option value="">Select category</option>` +
        filtered.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      resetSubcategorySelect();
    }

    function resetSubcategorySelect() {
      const subSelect = document.getElementById('listing-subcategory');
      subSelect.innerHTML = `<option value="">Select category first</option>`;
      subSelect.disabled = true;
    }

    async function populateSubcategoryOptions(categoryId) {
      const subSelect = document.getElementById('listing-subcategory');
      if (!categoryId) { resetSubcategorySelect(); return; }
      subSelect.innerHTML = `<option value="">Loading...</option>`;
      subSelect.disabled = true;
      try {
        const data = await apiRequest(`/listings/subcategories/${categoryId}`);
        const subs = data.subcategories || [];
        subSelect.innerHTML = `<option value="">Select subcategory (optional)</option>` +
          subs.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
        subSelect.disabled = subs.length === 0;
      } catch (err) {
        subSelect.innerHTML = `<option value="">Could not load subcategories</option>`;
      }
    }

    populateCategoryOptions();

    document.getElementById('listing-category').addEventListener('change', (e) => {
      populateSubcategoryOptions(e.target.value);
    });

    backdrop.querySelectorAll('[data-listing-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        backdrop.querySelectorAll('[data-listing-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        listingType = btn.dataset.listingType;
        document.getElementById('condition-group').style.display = listingType === 'good' ? 'block' : 'none';
        document.getElementById('quantity-group').style.display = listingType === 'good' ? 'block' : 'none';
        populateCategoryOptions();
      });
    });

    document.getElementById('close-upload-modal').addEventListener('click', () => backdrop.remove());
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

    function renderImagePreviews() {
      const grid = document.getElementById('image-preview-grid');
      grid.innerHTML = selectedFiles.map((file, index) => {
        const url = URL.createObjectURL(file);
        return `
          <div class="image-preview-thumb">
            <img src="${url}" alt="Preview ${index + 1}" />
            <span class="remove-thumb" data-index="${index}">✕</span>
          </div>
        `;
      }).join('');
      grid.querySelectorAll('.remove-thumb').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedFiles.splice(parseInt(btn.dataset.index, 10), 1);
          renderImagePreviews();
        });
      });
      document.querySelectorAll('.photo-source-label').forEach(label => {
        if (!label.dataset.original) label.dataset.original = label.textContent;
        label.textContent = selectedFiles.length > 0
          ? `${label.dataset.original} (${selectedFiles.length}/5)`
          : label.dataset.original;
      });
    }

    function addFiles(fileList) {
      const newFiles = Array.from(fileList || []);
      selectedFiles = [...selectedFiles, ...newFiles].slice(0, 5);
      renderImagePreviews();
    }

    document.getElementById('listing-images-gallery').addEventListener('change', (e) => {
      addFiles(e.target.files);
      e.target.value = ''; // allow re-selecting the same file after removal
    });

    document.getElementById('listing-images-camera').addEventListener('change', (e) => {
      addFiles(e.target.files);
      e.target.value = ''; // allow taking another photo after this one
    });

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-listing-btn');
      const alertBox = document.getElementById('upload-alert');
      alertBox.innerHTML = '';

      if (listingType === 'good' && !document.getElementById('listing-condition').value) {
        alertBox.innerHTML = `<div class="alert alert-error">Please select a condition (Brand New or Used).</div>`;
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const formData = new FormData();
      formData.append('title', document.getElementById('listing-title').value.trim());
      formData.append('price', document.getElementById('listing-price').value);
      formData.append('quantity', listingType === 'good' ? document.getElementById('listing-quantity').value : '1');
      formData.append('listingType', listingType);
      formData.append('categoryId', document.getElementById('listing-category').value);
      formData.append('subcategoryId', document.getElementById('listing-subcategory').value);
      formData.append('condition', listingType === 'good' ? document.getElementById('listing-condition').value : 'n_a');
      formData.append('location', document.getElementById('listing-location').value.trim());
      formData.append('description', document.getElementById('listing-description').value.trim());
      selectedFiles.forEach(file => formData.append('images', file));

      try {
        await apiRequest('/listings', { method: 'POST', body: formData, isForm: true });
        showToast('Listing submitted for review!', 'success');
        backdrop.remove();
        loadMyListings();
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Submit Listing for Review';
      }
    });
  }

  function placeholderIcon() {
    return `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
