<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listing — UJ Connect</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="layout-root"></div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
  const listingId = new URLSearchParams(window.location.search).get('id');
  let currentListing = null;

  document.addEventListener('DOMContentLoaded', () => {
    renderLayout('marketplace');
    loadListing();
  });

  async function loadListing() {
    const content = document.getElementById('page-content');
    if (!listingId) {
      content.innerHTML = `<p class="text-muted">No listing specified.</p>`;
      return;
    }
    content.innerHTML = `<p class="text-muted">Loading listing...</p>`;
    try {
      const data = await apiRequest(`/listings/${listingId}`);
      const l = data.listing;
      currentListing = l;
      const currentUser = getUser();
      const isOwner = currentUser && currentUser.id === l.user_id;
      const images = (l.images && l.images.length > 0) ? l.images : (l.image ? [l.image] : []);

      const mainImageHtml = images.length > 0
        ? `<img id="main-listing-image" src="${images[0]}" alt="${escHtml(l.title)}" />`
        : `<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;

      const thumbRow = images.length > 1 ? `
        <div class="gallery-thumb-row">
          ${images.map((img, i) => `<div class="gallery-thumb ${i === 0 ? 'active' : ''}" data-src="${img}"><img src="${img}" alt="thumbnail ${i + 1}" /></div>`).join('')}
        </div>
      ` : '';

      const ratingHtml = l.sellerRating && l.sellerRating.count > 0
        ? `<div class="rating-summary"><span class="review-stars">${starString(Math.round(l.sellerRating.average))}</span> <strong>${l.sellerRating.average}</strong> <span class="text-muted">(${l.sellerRating.count} review${l.sellerRating.count === 1 ? '' : 's'})</span></div>`
        : `<div class="text-muted" style="font-size:0.82rem;">No reviews yet</div>`;

      content.innerHTML = `
        <a href="marketplace.html" class="btn btn-ghost btn-sm" style="margin-bottom:18px;">← Back to Marketplace</a>
        <div class="detail-grid">
          <div>
            <div class="detail-image">${mainImageHtml}</div>
            ${thumbRow}
          </div>
          <div>
            <span class="badge ${l.listing_type === 'good' ? 'badge-good' : 'badge-service'}" style="position:static;display:inline-block;margin-bottom:10px;">
              ${l.listing_type === 'good' ? 'Good' : 'Service'}
            </span>
            <h1 style="margin:0 0 8px;font-size:1.6rem;">${escHtml(l.title)}</h1>
            <div class="listing-card-price" style="font-size:1.6rem;margin-bottom:10px;">${formatPrice(l.price)}</div>
            <p class="text-muted" style="margin-bottom:4px;">${escHtml(l.category_name || 'General')}${l.subcategory_name ? ' · ' + escHtml(l.subcategory_name) : ''} ${l.location ? '· ' + escHtml(l.location) : ''}</p>
            <p class="text-muted" style="font-size:0.82rem;">Listed ${timeAgo(l.created_at)} · ${l.views} views</p>
            ${l.condition_type && l.condition_type !== 'n_a' ? `<p><strong>Condition:</strong> ${escHtml(prettyCondition(l.condition_type))}</p>` : ''}
            <p style="line-height:1.6;margin-top:16px;">${escHtml(l.description || 'No description provided.')}</p>

            ${l.listing_type === 'good' && !isOwner ? renderQuantitySection(l) : ''}

            <div class="seller-box">
              <div class="avatar-circle">${initials(l.seller_name)}</div>
              <div>
                <div style="font-weight:700;">${escHtml(l.seller_name)}</div>
                <div class="text-muted" style="font-size:0.82rem;">${escHtml(l.seller_email)}</div>
                ${l.seller_phone ? `<div class="text-muted" style="font-size:0.82rem;">📞 ${escHtml(l.seller_phone)}</div>` : ''}
                ${ratingHtml}
                ${l.seller_bio ? `<p style="font-size:0.85rem;margin:8px 0 0;">${escHtml(l.seller_bio)}</p>` : ''}
              </div>
            </div>

            ${isOwner ? `
              <div class="alert" style="background:var(--surface-2);color:var(--text);margin-top:18px;">
                This is your own listing. Manage it from your <a href="dashboard.html" style="color:var(--primary);font-weight:700;">dashboard</a>.
              </div>
            ` : `
              <div id="contact-area" style="margin-top:18px;">
                <button id="contact-btn" class="btn btn-primary" ${l.listing_type === 'good' && l.quantity <= 0 ? 'disabled' : ''}>Message Seller</button>
                <button id="report-btn" class="btn btn-ghost">Report Listing</button>
              </div>
              <div id="message-form-wrap"></div>
            `}
          </div>
        </div>

        <div class="panel" style="margin-top:28px;">
          <div class="section-title-row" style="margin-bottom:14px;">
            <h2 style="font-size:1.15rem;">Seller Reviews</h2>
          </div>
          <div id="review-form-wrap"></div>
          <div id="reviews-list"><p class="text-muted">Loading reviews...</p></div>
        </div>
      `;

      if (images.length > 1) {
        content.querySelectorAll('.gallery-thumb').forEach(thumb => {
          thumb.addEventListener('click', () => {
            document.getElementById('main-listing-image').src = thumb.dataset.src;
            content.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
          });
        });
      }

      if (!isOwner) {
        document.getElementById('contact-btn').addEventListener('click', () => showMessageForm(l));
        document.getElementById('report-btn').addEventListener('click', () => showReportForm(l));
        if (l.listing_type === 'good') wireQuantityStepper(l);
      }

      loadReviews(l);
    } catch (err) {
      content.innerHTML = `<p class="text-muted">Could not load this listing: ${err.message}</p>`;
    }
  }

  function starString(rating) {
    const full = Math.max(0, Math.min(5, rating || 0));
    return '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  function prettyCondition(c) {
    return { brand_new: 'Brand New', used: 'Used', n_a: 'N/A' }[c] || c;
  }

  let selectedQuantity = 1;

  function renderQuantitySection(listing) {
    const stock = parseInt(listing.quantity, 10);
    if (isNaN(stock) || stock <= 0) {
      return `<p class="stock-badge out" style="margin:14px 0;">Out of Stock</p>`;
    }
    selectedQuantity = 1;
    return `
      <div style="margin:14px 0;">
        <label style="font-weight:600;font-size:0.88rem;display:block;margin-bottom:6px;">Quantity</label>
        <div class="flex" style="align-items:center;gap:12px;">
          <div class="quantity-stepper">
            <button type="button" id="qty-decrease" aria-label="Decrease quantity">−</button>
            <span class="quantity-value" id="qty-value">1</span>
            <button type="button" id="qty-increase" aria-label="Increase quantity">+</button>
          </div>
          <span class="stock-badge">${stock} in stock</span>
        </div>
      </div>
    `;
  }

  function wireQuantityStepper(listing) {
    const decBtn = document.getElementById('qty-decrease');
    const incBtn = document.getElementById('qty-increase');
    const valueEl = document.getElementById('qty-value');
    if (!decBtn || !incBtn || !valueEl) return;

    const stock = parseInt(listing.quantity, 10) || 1;

    function updateButtons() {
      valueEl.textContent = selectedQuantity;
      decBtn.disabled = selectedQuantity <= 1;
      incBtn.disabled = selectedQuantity >= stock;
    }

    decBtn.addEventListener('click', () => {
      if (selectedQuantity > 1) { selectedQuantity--; updateButtons(); }
    });
    incBtn.addEventListener('click', () => {
      if (selectedQuantity < stock) { selectedQuantity++; updateButtons(); }
    });
    updateButtons();
  }

  function showMessageForm(listing) {
    if (!isLoggedIn()) {
      showToast('Please log in to message the seller.', 'error');
      setTimeout(() => window.location.href = 'login.html', 900);
      return;
    }
    const prefill = listing.listing_type === 'good'
      ? `Hi, I'd like to buy ${selectedQuantity} of these. Is this still available?`
      : '';
    const wrap = document.getElementById('message-form-wrap');
    wrap.innerHTML = `
      <div class="panel" style="margin-top:14px;">
        <div class="form-group">
          <label>Message to ${escHtml(listing.seller_name)}</label>
          <textarea id="msg-text" class="text-input w-full" rows="3" placeholder="Hi, is this still available?">${escHtml(prefill)}</textarea>
        </div>
        <button class="btn btn-primary btn-sm" id="send-msg-btn">Send Message</button>
      </div>
    `;
    document.getElementById('send-msg-btn').addEventListener('click', async () => {
      const message = document.getElementById('msg-text').value.trim();
      if (!message) { showToast('Please write a message first.', 'error'); return; }
      try {
        await apiRequest('/messages', {
          method: 'POST',
          body: { listingId: listing.id, receiverId: listing.user_id, message }
        });
        showToast('Message sent! Check your Dashboard → Messages for replies.', 'success');
        wrap.innerHTML = '';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  }

  function showReportForm(listing) {
    if (!isLoggedIn()) {
      showToast('Please log in to report a listing.', 'error');
      setTimeout(() => window.location.href = 'login.html', 900);
      return;
    }
    const reason = prompt('Why are you reporting this listing?');
    if (!reason || !reason.trim()) return;
    apiRequest('/reports', { method: 'POST', body: { listingId: listing.id, reason: reason.trim() } })
      .then(() => showToast('Report submitted. Thank you.', 'success'))
      .catch(err => showToast(err.message, 'error'));
  }

  // ---------- Reviews ----------
  async function loadReviews(listing) {
    const currentUser = getUser();
    const isOwner = currentUser && currentUser.id === listing.user_id;
    const formWrap = document.getElementById('review-form-wrap');
    const listWrap = document.getElementById('reviews-list');

    if (!isOwner && isLoggedIn()) {
      try {
        const statusData = await apiRequest(`/reviews/status/${listing.id}`);
        if (!statusData.hasReviewed) {
          renderReviewForm(formWrap, listing);
        } else {
          formWrap.innerHTML = `<p class="text-muted" style="font-size:0.85rem;margin-bottom:14px;">You've already reviewed this listing. Thanks for your feedback!</p>`;
        }
      } catch (err) { /* silently skip form if status check fails */ }
    } else if (!isLoggedIn()) {
      formWrap.innerHTML = `<p class="text-muted" style="font-size:0.85rem;margin-bottom:14px;"><a href="login.html" style="color:var(--primary);font-weight:700;">Log in</a> to leave a review for this seller.</p>`;
    }

    try {
      const data = await apiRequest(`/reviews/seller/${listing.user_id}`);
      const reviews = data.reviews || [];
      if (reviews.length === 0) {
        listWrap.innerHTML = `<p class="text-muted">No reviews yet for this seller.</p>`;
        return;
      }
      listWrap.innerHTML = reviews.map(r => `
        <div class="review-item">
          <div class="flex-between">
            <div>
              <strong>${escHtml(r.reviewer_name)}</strong>
              <span class="text-muted" style="font-size:0.78rem;"> · ${escHtml(r.listing_title)}</span>
            </div>
            <span class="text-muted" style="font-size:0.78rem;">${timeAgo(r.created_at)}</span>
          </div>
          <div class="review-stars" style="margin:4px 0;">${starString(r.rating)}</div>
          ${r.comment ? `<p style="margin:0;font-size:0.9rem;">${escHtml(r.comment)}</p>` : ''}
        </div>
      `).join('');
    } catch (err) {
      listWrap.innerHTML = `<p class="text-muted">Could not load reviews.</p>`;
    }
  }

  function renderReviewForm(container, listing) {
    let selectedRating = 0;
    container.innerHTML = `
      <div class="panel" style="background:var(--surface-2);margin-bottom:18px;">
        <label style="font-weight:600;font-size:0.9rem;display:block;margin-bottom:8px;">Leave a review for ${escHtml(listing.seller_name)}</label>
        <div class="star-rating" id="review-star-input">
          ${[1,2,3,4,5].map(i => `<span class="star" data-value="${i}">★</span>`).join('')}
        </div>
        <div class="form-group" style="margin-top:12px;">
          <textarea id="review-comment" class="text-input w-full" rows="2" placeholder="Share your experience (optional)"></textarea>
        </div>
        <div id="review-form-alert"></div>
        <button class="btn btn-primary btn-sm" id="submit-review-btn">Submit Review</button>
      </div>
    `;

    const stars = container.querySelectorAll('#review-star-input .star');
    stars.forEach(star => {
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.value, 10);
        stars.forEach(s => s.classList.toggle('filled', parseInt(s.dataset.value, 10) <= selectedRating));
      });
    });

    document.getElementById('submit-review-btn').addEventListener('click', async () => {
      const alertBox = document.getElementById('review-form-alert');
      alertBox.innerHTML = '';
      if (selectedRating === 0) {
        alertBox.innerHTML = `<div class="alert alert-error">Please select a star rating.</div>`;
        return;
      }
      const comment = document.getElementById('review-comment').value.trim();
      try {
        await apiRequest('/reviews', { method: 'POST', body: { listingId: listing.id, rating: selectedRating, comment } });
        showToast('Thanks for your review!', 'success');
        loadReviews(listing);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  }

  function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
